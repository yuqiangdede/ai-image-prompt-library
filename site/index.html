<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="AI 生图 Prompt 和 Skill 素材库，按效果图查找，一键复制，关联上游自动同步。">
  <title>Prompt & Skill Gallery · 生图灵感库</title>
  <link rel="stylesheet" href="./app.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="回到图库"><span class="brand-symbol">P<span>✳</span>S</span><span class="brand-text">PROMPT<br><small>LIBRARY</small></span></a>
      <div class="top-right"><span class="status"><span class="status-dot"></span> GitHub 自动同步</span><a id="repository-link" class="repo-link" href="https://github.com/yuqiangdede/ai-image-prompt-library" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
    </div>
  </header>
  <main class="shell">
    <section class="workspace" aria-label="图库浏览">
      <div class="workspace-head"><div><p class="eyebrow small">PROMPT & SKILL LIBRARY</p><h2>灵感素材库</h2><p class="workspace-intro">按效果图查找 Prompt、Skill，快速复制创作方法。</p></div><div class="workspace-count" aria-label="图库素材数量"><strong id="hero-count">—</strong><span>个素材</span></div></div>
      <div class="tools">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索风格、Skill、标签、提示词…" autocomplete="off" aria-label="搜索素材"><kbd>/</kbd></label>
        <select id="sort" aria-label="排序方式"><option value="new">最近更新</option><option value="az">名称 A—Z</option></select>
      </div>
      <nav class="tabs" id="nav-tabs" aria-label="素材类型">
        <button type="button" data-type="all" class="active">全部素材 <span id="count-all">0</span></button>
        <button type="button" data-type="skill">Skills <span id="count-skill">0</span></button>
        <button type="button" data-type="prompt">Prompts <span id="count-prompt">0</span></button>
        <button type="button" data-type="favorites">♡ 收藏 <span id="count-favorites">0</span></button>
      </nav>
      <div class="filters"><div id="category-nav" class="categories"></div><button id="reset-filter" class="clear" hidden>清除筛选 ×</button></div>
      <div class="result-info"><span id="result-count">正在读取素材…</span><span>点开图片，复制创作方法 ↗</span></div>
      <div id="gallery" class="gallery" aria-live="polite"><div class="empty">正在读取图库…</div></div>
    </section>
    <footer class="footer"><span>© PROMPT & SKILL GALLERY</span><span>内容由 GitHub 托管 · 请尊重原作者许可</span><a href="https://github.com/yuqiangdede/ai-image-prompt-library" target="_blank" rel="noopener">查看源代码 ↗</a></footer>
  </main>
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop" data-dismiss="1"></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="modal-top"><span id="detail-kind">SKILL</span><button id="close-modal" type="button" aria-label="关闭详情">✕</button></div>
      <div class="modal-layout">
        <div class="preview-pane"><div id="detail-hero" class="detail-hero"></div><div id="detail-thumbs" class="thumbs"></div></div>
        <div class="info-pane"><h2 id="detail-title"></h2><p id="detail-description" class="description"></p><div id="detail-tags" class="detail-tags"></div>
          <div id="detail-meta" class="detail-meta"></div>
          <div id="source-box" class="source-box" hidden><span>UPSTREAM SOURCE</span><a id="upstream-link" href="#" target="_blank" rel="noopener">查看原始 Skill ↗</a><code id="upstream-sha"></code></div>
          <div class="action-stack"><button id="copy-primary" class="primary-action">复制完整内容</button><div class="secondary-actions"><button id="copy-text">仅复制原文</button><button id="download-file">下载文件</button></div></div>
          <p id="detail-note" class="detail-note"></p><div id="detail-related" class="related"></div>
          <div class="content-box"><div class="content-head"><h3 id="content-heading">完整内容</h3><a id="open-source" target="_blank" rel="noopener">在 GitHub 中打开 ↗</a></div><pre id="detail-content"></pre></div>
        </div>
      </div>
    </section>
  </div>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>

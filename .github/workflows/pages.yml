name: Deploy Prompt & Skill Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "同步上游 Skill 后发布"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: '23 4 * * *'
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[导入 Skill]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import public Skill from owner issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/import_skill.py
          git add library/skills
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat(skills): import from issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
          fi
      - name: Comment on failed import
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "自动导入失败。请在 Actions 查看日志。检查仓库是否公开、是否包含 SKILL.md；包含多个 Skill 时请提供具体文件链接。"
      - name: Synchronize allowlisted upstream files
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream)
        run: |
          python scripts/sync_upstream.py
          git add library/skills
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(skills): sync upstream changes'
            git push origin HEAD:main
          fi
      - name: Build static gallery
        run: python scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm successful Skill import
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Skill 已自动导入。图库：https://yuqiangdede.github.io/ai-image-prompt-library/"
          gh issue close "$ISSUE_NUMBER" --reason completed

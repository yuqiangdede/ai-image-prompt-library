name: Deploy Prompt & Skill Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "同步上游 Skill 后发布"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize allowlisted upstream files
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream)
        run: |
          python scripts/sync_upstream.py
          git add library/skills
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(skills): sync upstream changes'
            git push origin HEAD:main
          fi
      - name: Build static gallery
        run: python scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
